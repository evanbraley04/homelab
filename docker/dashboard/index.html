<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evan's HomeLab Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Evan's HomeLab Dashboard</h1>
    </header>

    <main class="dashboard">

        <a href="https://jellyfin.homelab" class="card">
            <img src="images/movies.jpg" alt="Movies">
            <div class="card-text">
                <h2>Movies</h2>
                <p>Jellyfin</p>
            </div>
        </a>

        <a href="https://navidrome.homelab" class="card">
            <img src="images/music.jpg" alt="Music">
            <div class="card-text">
                <h2>Music</h2>
                <p>Navidrome</p>
            </div>
        </a>

        <a href="https://kavita.homelab" class="card">
            <img src="images/books.jpg" alt="Books">
            <div class="card-text">
                <h2>Books</h2>
                <p>Kavita</p>
            </div>
        </a>

        <a href="https://nextcloud.homelab" class="card">
            <img src="images/journal.jpg" alt="Journal">
            <div class="card-text">
                <h2>Journal</h2>
                <p>Nextcloud</p>
            </div>
        </a>

        <a href="http://pi-hole.homelab/admin/" class="card">
            <img src="images/dns.jpg" alt="DNS and ad blocking">
            <div class="card-text">
                <h2>DNS / Ad-Block</h2>
                <p>Pi-hole</p>
            </div>
        </a>

        <a href="https://login.tailscale.com/admin" class="card">
            <img src="images/vpn.jpg" alt="VPN">
            <div class="card-text">
                <h2>VPN</h2>
                <p>Tailscale</p>
            </div>
        </a>

        <a href="https://portainer.homelab" class="card">
            <img src="images/docker.jpg" alt="Docker management">
            <div class="card-text">
                <h2>Docker Management</h2>
                <p>Portainer</p>
            </div>
        </a>

        <a href="https://uptime.homelab" class="card">
            <img src="images/monitoring.jpg" alt="Monitoring">
            <div class="card-text">
                <h2>Monitoring</h2>
                <p>Uptime Kuma</p>
            </div>
        </a>

    </main>

</body>
</html>
